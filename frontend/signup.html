<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Pacific BioArchive</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Create an account</h1>
      <p class="subtitle">We will send a verification code to your email. Verify it to activate your account.</p>

      <!-- Step 1: 注册信息 -->
      <form id="signupForm">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
        <label for="firstName">First name</label>
        <input type="text" id="firstName" required autocomplete="given-name">
        <label for="lastName">Last name</label>
        <input type="text" id="lastName" required autocomplete="family-name">
        <label for="password">Password (min 8 chars, upper/lower/digit/symbol)</label>
        <input type="password" id="password" required autocomplete="new-password">
        <label for="password2">Confirm password</label>
        <input type="password" id="password2" required autocomplete="new-password">
        <button type="submit">Sign up</button>
      </form>

      <!-- Step 2: 邮箱验证码确认 -->
      <form id="confirmForm" class="hidden">
        <p id="confirmEmail" class="subtitle"></p>
        <label for="code">Verification code (sent to your email)</label>
        <input type="text" id="code" required autocomplete="one-time-code" inputmode="numeric">
        <button type="submit">Verify and continue</button>
        <button type="button" id="btnResend" class="secondary">Resend code</button>
        <button type="button" id="btnChangeEmail" class="secondary">Use a different email</button>
      </form>

      <div id="msg"></div>
      <p class="link-line">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function () {
      Auth.redirectIfAuthenticated();
      const $ = id => document.getElementById(id);
      const msg = $('msg');
      let pendingEmail = (localStorage.getItem('pba_pending_email') || '').trim();

      function show(text, cls) {
        msg.className = 'msg ' + (cls || 'info');
        msg.textContent = text;
      }

      function showConfirmation(email, message) {
        pendingEmail = email;
        localStorage.setItem('pba_pending_email', email);
        $('signupForm').classList.add('hidden');
        $('confirmForm').classList.remove('hidden');
        $('confirmEmail').textContent = 'Code sent to ' + email;
        $('code').focus();
        if (message) show(message, 'success');
      }

      function showRegistration() {
        pendingEmail = '';
        localStorage.removeItem('pba_pending_email');
        $('confirmForm').classList.add('hidden');
        $('signupForm').classList.remove('hidden');
        $('email').value = '';
        $('code').value = '';
        msg.className = '';
        msg.textContent = '';
        $('email').focus();
      }

      // Recover an interrupted verification flow, including users sent here
      // after Cognito reports UserNotConfirmedException on the login page.
      if (pendingEmail) {
        showConfirmation(pendingEmail, 'Enter the verification code previously sent to your email.');
      }

      $('signupForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const email = $('email').value.trim();
        const firstName = $('firstName').value.trim();
        const lastName = $('lastName').value.trim();
        const password = $('password').value;
        if (password !== $('password2').value) { show('Passwords do not match.', 'error'); return; }
        const btn = e.target.querySelector('button');
        btn.disabled = true;
        try {
          await Auth.signUp(email, firstName, lastName, password);
          showConfirmation(email, 'Verification email sent. Enter the code below.');
        } catch (err) {
          show(err.message, 'error');
        } finally {
          btn.disabled = false;
        }
      });

      $('confirmForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const email = pendingEmail;
        const btn = e.target.querySelector('button[type=submit]');
        btn.disabled = true;
        try {
          await Auth.confirmSignUp(email, $('code').value.trim());
          pendingEmail = '';
          localStorage.removeItem('pba_pending_email');
          show('Account verified! Redirecting to sign in...', 'success');
          setTimeout(() => window.location.href = './login.html', 1500);
        } catch (err) {
          show(err.message, 'error');
        } finally {
          btn.disabled = false;
        }
      });

      $('btnResend').addEventListener('click', async function () {
        const email = pendingEmail;
        try {
          await Auth.resendCode(email);
          show('Code resent to ' + email, 'success');
        } catch (err) {
          show(err.message, 'error');
        }
      });

      $('btnChangeEmail').addEventListener('click', function () {
        showRegistration();
      });
    })();
  </script>
</body>
</html>
