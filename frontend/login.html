<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Pacific BioArchive</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Sign in</h1>
      <p class="subtitle">Access your wildlife media library.</p>
      <form id="loginForm">
        <label for="username">Email</label>
        <input type="email" id="username" required autocomplete="username">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
        <button type="submit">Sign in</button>
      </form>
      <div class="auth-divider" aria-hidden="true"><span>or</span></div>
      <button type="button" id="btnGoogle" class="google-signin">
        <svg viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.205c0-.638-.057-1.252-.164-1.841H9v3.482h4.844a4.14 4.14 0 0 1-1.797 2.715v2.258h2.909c1.702-1.567 2.684-3.875 2.684-6.614Z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.468-.806 5.956-2.181l-2.909-2.258c-.806.54-1.835.859-3.047.859-2.344 0-4.328-1.585-5.037-3.714H.956v2.332A9 9 0 0 0 9 18Z"/>
          <path fill="#FBBC05" d="M3.963 10.706A5.41 5.41 0 0 1 3.682 9c0-.592.102-1.168.281-1.706V4.962H.956A9 9 0 0 0 0 9c0 1.452.347 2.827.956 4.038l3.007-2.332Z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.507.454 3.441 1.346l2.581-2.581C13.464.892 11.426 0 9 0A9 9 0 0 0 .956 4.962l3.007 2.332C4.672 5.165 6.656 3.58 9 3.58Z"/>
        </svg>
        Continue with Google
      </button>
      <div id="msg"></div>
      <p class="link-line">No account? <a href="signup.html">Sign up</a></p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function () {
      Auth.redirectIfAuthenticated();
      const $ = id => document.getElementById(id);
      const msg = $('msg');

      function show(text, cls) {
        msg.className = 'msg ' + (cls || 'info');
        msg.textContent = text;
      }

      function showVerificationRequired(email) {
        localStorage.setItem('pba_pending_email', email);
        msg.className = 'msg error';
        msg.textContent = 'Please verify your email first. ';

        const link = document.createElement('a');
        link.href = 'signup.html';
        link.textContent = 'Enter verification code';
        msg.appendChild(link);
      }

      $('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        btn.disabled = true;
        try {
          await Auth.login($('username').value.trim(), $('password').value);
          show('Signed in. Redirecting...', 'success');
          setTimeout(() => window.location.href = './index.html', 800);
        } catch (err) {
          // UserNotConfirmedException: 需要先邮箱验证
          if (err.code === 'UserNotConfirmedException') {
            showVerificationRequired($('username').value.trim());
          } else {
            show(err.message, 'error');
          }
        } finally {
          btn.disabled = false;
        }
      });

      $('btnGoogle').addEventListener('click', async function () {
        const btn = this;
        btn.disabled = true;
        try {
          show('Opening Google sign-in...', 'info');
          await Auth.startGoogleLogin();
        } catch (err) {
          show(err.message, 'error');
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
